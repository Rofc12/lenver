  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      mostrarDetalle(params.get("id"));

      // El botón de WhatsApp aparece solo al llegar al footer, no desde
      // el principio como en la página de Contacto.
      const whatsappDetalle = document.getElementById("whatsapp-float-detalle");
      const footer = document.getElementById("footer");
      if (whatsappDetalle && footer) {
        const footerObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              whatsappDetalle.classList.toggle("show", entry.isIntersecting);
            });
          },
          { threshold: 0.15 }
        );
        footerObserver.observe(footer);
      }
    });
  </script>
